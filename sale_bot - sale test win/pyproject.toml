[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sale-bot"
version = "0.3.0"
description = "Keyword and price tracker for Korean second-hand marketplaces"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "discord.py>=2.4,<3",
  "httpx>=0.28,<1",
  "playwright>=1.55,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"src/sale_bot/providers.py" = ["I001", "TRY004"]
