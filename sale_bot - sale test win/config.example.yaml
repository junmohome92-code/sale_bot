poll_interval_seconds: 300
alert_on_first_seen: true
alert_on_price_increase: false
bootstrap_silently: true
request_timeout_seconds: 20

watches:
  - name: "RX 9070 XT"
    query: "9070 xt"
    min_price: 500000
    max_price: 1200000
    exclude_keywords:
      - "삽니다"
      - "구매"
      - "매입"
    providers:
      - daangn
      - joongna
      - bunjang
    # 당근 지역은 쉼표로 최대 5개까지 지정 가능
    daangn_region: "복대동, 가경동, 봉명동, 사창동"
