name: apply-transaction-filters

on:
  push:
    branches:
      - feat/transaction-type-filters
    paths:
      - tools/apply_transaction_filters_patch.py
      - .github/workflows/apply-transaction-filters.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/transaction-type-filters
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/apply_transaction_filters_patch.py
      - name: Install dev dependencies
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src tests
      - name: Pytest
        run: pytest -q
      - name: Commit patched sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/apply_transaction_filters_patch.py .github/workflows/apply-transaction-filters.yml
          git add src tests config.example.yaml
          git commit -m 'feat: add per-watch buying and selling filters'
          git push origin HEAD:feat/transaction-type-filters
