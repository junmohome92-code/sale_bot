name: apply-market-patch

on:
  push:
    branches:
      - fix/market-region-and-price-floor
    paths:
      - tools/apply_market_patch.py
      - .github/workflows/apply-market-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/market-region-and-price-floor
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/apply_market_patch.py
      - name: Commit generated patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/sale_bot/storage.py src/sale_bot/admin.py config.example.yaml
          git diff --cached --check
          git commit -m "feat: add ignored price floor to watch management"
          git push origin HEAD:fix/market-region-and-price-floor
