name: live-region-probe

on:
  push:
    branches:
      - fix/market-region-and-price-floor
    paths:
      - tools/live_region_probe.py
      - .github/workflows/live-region-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install httpx
      - run: python tools/live_region_probe.py
