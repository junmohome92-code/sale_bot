name: windows-test-copy

on:
  push:
    branches: [main]
    paths:
      - "sale_bot - sale test win/**"
      - ".github/workflows/windows-test-copy.yml"
  pull_request:
    paths:
      - "sale_bot - sale test win/**"
      - ".github/workflows/windows-test-copy.yml"

jobs:
  windows-test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: "sale_bot - sale test win"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Windows setup path
        shell: pwsh
        run: .\win.ps1 setup
      - name: Windows test path
        shell: pwsh
        run: .\win.ps1 test
      - name: SALE_TEST launcher smoke
        shell: cmd
        env:
          PYTHONUTF8: "1"
        run: (echo 0) | call SALE_TEST.bat
