# Provider loops target a five-minute refresh. If a Daangn citywide workload itself
# takes longer than five minutes, it runs continuously and /status shows the real duration.
poll_interval_seconds: 300
request_timeout_seconds: 20

# Runtime watch settings live in SQLite after the first start and are normally managed
# from Telegram /menu. This list is only a one-time seed for a fresh database.
watches: []

